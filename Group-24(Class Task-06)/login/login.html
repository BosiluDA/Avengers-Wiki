<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX JSON Example</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        .output {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center">Avengers Wikipedia</h1>
        <div class="mb-3">
            <button class="btn btn-primary" id="load-all">Load All Records</button>
            <button class="btn btn-secondary" id="load-one">Load Record by ID</button>
        </div>

        <div id="record-id-input" class="mb-3" style="display: none;">
            <input type="number" id="record-id" class="form-control" placeholder="Enter Record ID">
            <button class="btn btn-info mt-2" id="fetch-id">Fetch</button>
        </div>

        <div id="new-record-form" class="mb-3">
            <h3>Add New Member</h3>
            <input type="text" id="name" class="form-control mb-2" placeholder="Name">
            <input type="email" id="email" class="form-control mb-2" placeholder="Email">
            <input type="number" id="age" class="form-control mb-2" placeholder="Age">
            <input type="text" id="gender" class="form-control mb-2" placeholder="Gender">
            <input type="text" id="country" class="form-control mb-2" placeholder="Country">
            <button class="btn btn-success" id="add-record">Add Record</button>
        </div>

        <div class="output" id="output"></div>
    </div>

    <script>
        $(document).ready(function () {
            // Load all records
            $("#load-all").click(function () {
                $.ajax({
                    url: "api.php",
                    method: "GET",
                    success: function (data) {
                        $("#output").html("<pre>" + JSON.stringify(data, null, 2) + "</pre>");
                    }
                });
            });

            // Show input for fetching a specific record
            $("#load-one").click(function () {
                $("#record-id-input").toggle();
            });

            // Fetch a specific record
            $("#fetch-id").click(function () {
                const id = $("#record-id").val();
                if (id) {
                    $.ajax({
                        url: "api.php",
                        method: "GET",
                        data: { id },
                        success: function (data) {
                            $("#output").html("<pre>" + JSON.stringify(data, null, 2) + "</pre>");
                        }
                    });
                } else {
                    alert("Please enter a record ID.");
                }
            });

            // Add a new record
            $("#add-record").click(function () {
                const newRecord = {
                    name: $("#name").val(),
                    email: $("#email").val(),
                    age: parseInt($("#age").val()),
                    gender: $("#gender").val(),
                    country: $("#country").val()
                };
                $.ajax({
                    url: "api.php",
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(newRecord),
                    success: function (response) {
                        alert(response.message);
                        $("#new-record-form input").val(""); // Clear inputs
                    }
                });
            });
        });
    </script>
</body>

</html>
